services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-graphiti
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  graphiti:
    image: zepai/knowledge-graph-mcp:latest
    container_name: graphiti-server
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - GRAPHITI_PORT=8000
      - GRAPHITI_EMBEDDINGS_PROVIDER=openai
      - GRAPHITI_EMBEDDINGS_MODEL=text-embedding-ada-002
      - GRAPHITI_EMBEDDINGS_DIMENSIONS=1536
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    ports:
      - "8000:8000"
    volumes:
      - graphiti_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:
  graphiti_data:
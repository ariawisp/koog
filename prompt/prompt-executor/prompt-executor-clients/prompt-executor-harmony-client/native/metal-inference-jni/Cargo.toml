[package]
name = "metal-inference-jni"
version = "0.1.0"
edition = "2021"
authors = ["Koog AI Team"]
description = "Metal GPU inference backend for GPT-OSS models"

[lib]
name = "metal_inference_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-metal = "0.2"
block2 = "0.5"
core-graphics = "0.23"

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Stub dependencies for non-macOS platforms

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
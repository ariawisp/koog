[package]
name = "noesis-runtime"
version = "1.0.0"
edition = "2021"
authors = ["Noesis Team"]
description = "Unified cognitive engine - where inference, memory, and structure are one"

[lib]
crate-type = ["cdylib", "rlib"]
name = "noesis_runtime"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency
parking_lot = "0.12"
# JNI for Kotlin bridge
jni = "0.21"

# Metal GPU via objc2 (modern, maintained) - macOS only
objc2 = { version = "0.6.1", optional = true }
objc2-foundation = { version = "0.3.1", features = ["NSString", "NSRange"], optional = true }
objc2-metal = { version = "0.3.1", optional = true }

# CUDA support for Linux/WSL2
cust = { version = "0.3", optional = true }
cust_raw = { version = "0.11", optional = true }

# ONNX Runtime for future Windows support
# ort = { version = "2.0", optional = true } # Uncomment when ready

# Core data structures
petgraph = "0.6"          # Graph operations
dashmap = "6.0"           # Concurrent hashmaps
ahash = "0.8"             # Fast hashing
arc-swap = "1.7"          # Atomic Arc swapping

# Binary serialization
flatbuffers = "24.3"
bincode = "1.3"
bytes = "1.7"

# Harmony tokenizer and format
openai-harmony = { git = "https://github.com/openai/harmony" }
tiktoken-rs = "0.5"

# Memory mapping and persistence
memmap2 = "0.9"
tempfile = "3.10"

# Async runtime (for channel processing)
tokio = { version = "1.38", features = ["full"] }
crossbeam-channel = "0.5"
futures-util = "0.3"

# Terminal output formatting
colored = "2.1"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
env_logger = "0.11"

# Random number generation
rand = "0.8"

# SIMD for fast token operations
simd-json = { version = "0.13", optional = true }

# Harmony tokenizer (from OpenAI) - moved to top of file

# Parsing libraries
pulldown-cmark = "0.12"  # Markdown parsing
regex = "1.10"  # Pattern matching for extraction



[features]
# Default to Metal on macOS, CUDA on Linux, nothing on Windows (for now)
default = ["metal"]

# Platform-specific backends
metal = ["objc2", "objc2-foundation", "objc2-metal"]
cuda = ["cust", "cust_raw"]
onnx = [] # ["ort"] # Uncomment when ready

# Optional features
simd = ["simd-json"]
debug-gpu = []  # Extra GPU debugging

# Multi-backend support (for testing)
all-backends = ["metal", "cuda", "onnx"]

[build-dependencies]
cc = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Dev dependencies removed - benchmarks moved to noesis-cli
# [dev-dependencies]
# criterion = { version = "0.5", features = ["html_reports"] }
